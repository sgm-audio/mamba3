[package]
name = "edge_dsp_plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
edge_dsp_core = { path = "../core" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_no_alloc"] }
ort = { version = "1.16.3", features = ["load-dynamic"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
lazy_static = "1.4.0"
